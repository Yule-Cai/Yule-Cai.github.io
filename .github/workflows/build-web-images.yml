name: Optimize public website images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-web-images.yml'

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Optimize original profile and public research figures
        run: python scripts/build_web_images.py
      - name: Check generated images
        run: |
          test -s assets/profile-420.webp
          test -s assets/profile-900.webp
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in sorted(Path('assets').glob('*.webp')):
              with Image.open(p) as im: im.verify()
              print(p, p.stat().st_size)
          PY
      - name: Save optimized images to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp
          if git diff --cached --quiet; then
            echo "No new image assets to commit."
          else
            git commit -m "Build responsive local portfolio images"
            git push origin HEAD:main
          fi