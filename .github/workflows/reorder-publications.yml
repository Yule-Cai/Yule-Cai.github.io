name: Update Springer reviewer section

on:
  push:
    paths:
      - '.github/workflows/reorder-publications.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update reviewer service
        run: python .github/scripts/update_reviewer.py
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Replace editor role with Springer Nature peer review service"
          git push
