name: Fix background and Scholar link

on:
  push:
    paths:
      - '.github/workflows/fix-background-scholar.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python .github/scripts/fix_background_scholar.py
      - name: Commit site update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore background loading and fix Google Scholar link"
          git push
